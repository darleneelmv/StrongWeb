<!doctype html>
<html lang="es-MX">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#061331">
  <title>Productos · Strong Gym Puruándiro</title>
  <meta name="description" content="Malteadas de proteína, suplementos, bebidas y accesorios en Strong Gym Puruándiro. Pídelos en recepción o por WhatsApp.">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Productos · Strong Gym Puruándiro">
  <meta property="og:description" content="Pesas, cardio, barra de proteína y un ambiente de comunidad. Conoce planes, productos y promociones.">
  <meta property="og:image" content="/img/compartir.jpg">
  <meta property="og:locale" content="es_MX">
  <link rel="icon" href="/img/icono-192.png">
  <link rel="apple-touch-icon" href="/img/icono-192.png">
  <link rel="preload" href="/fonts/big-shoulders.woff" as="font" type="font/woff" crossorigin>
  <link rel="stylesheet" href="/css/fuentes.css">
  <link rel="stylesheet" href="/css/sitio.css">
</head>
<body>
  <p class="aviso" id="aviso" hidden></p>
  <header class="cab">
    <a class="cab-marca" href="/" aria-label="Inicio">
      <img src="/img/logo.jpg" alt="" width="46" height="46">
      <span><b data-nombre>Strong Gym</b><small data-ciudad>Puruándiro</small></span>
    </a>
    <nav class="cab-nav" id="nav" aria-label="Secciones">
      <a href="/">Inicio</a>
      <a href="/productos" data-si="productos">Productos</a>
      <a href="/#galeria" data-si="galeria">Galería</a>
      <a href="/#videos">Videos</a>
      <a href="/#planes" data-si="planes">Precios</a>
      <a href="/#promociones" data-si="promociones">Promos</a>
      <a href="/#contacto">Contacto</a>
    </nav>
    <a class="boton boton-wa boton-chico cab-wa" data-wa href="#contacto">WhatsApp</a>
    <button class="cab-menu" id="btn-menu" type="button" aria-expanded="false" aria-controls="menu-movil" aria-label="Abrir menú"><span></span><span></span></button>
  </header>
  <nav class="menu-movil" id="menu-movil" aria-label="Menú" hidden></nav>

  <main id="contenido">
    <section class="p-cab">
      <div class="envoltura">
        <span class="etiqueta" style="color:var(--rojo-luz)">Tienda del gym</span>
        <h1 class="titulo" id="p-titulo">Productos</h1>
        <p class="subtitulo" id="p-texto"></p>
      </div>
    </section>
    <div class="filtros">
      <div class="envoltura">
        <div class="chips" id="chips" role="group" aria-label="Categorías"></div>
        <label class="buscar"><span class="sr">Buscar producto</span><input type="search" id="buscar" placeholder="Buscar…" autocomplete="off"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg></label>
      </div>
    </div>
    <section class="seccion" style="padding-top:36px">
      <div class="envoltura">
        <div id="lista"></div>
        <aside class="nota-tienda" id="nota"></aside>
      </div>
    </section>
  </main>

  <footer class="pie" id="pie"></footer>

  <script src="/js/vaso.js"></script>
  <script src="/js/comun.js"></script>
  <script src="/js/productos.js"></script>
</body>
</html>
