# =====================================================================
#  Strong Gym en Netlify
#  - public/              la página (HTML, estilos, imágenes)
#  - netlify/functions/   la parte que guarda lo que cambia recepción
#  Todo lo que sube recepción se guarda en Netlify Blobs (incluido gratis).
# =====================================================================
[build]
  publish = "public"
  functions = "netlify/functions"
  command = "echo 'Strong Gym listo'"

[build.environment]
  NODE_VERSION = "22"

[functions]
  node_bundler = "esbuild"

[[redirects]]
  from = "/productos"
  to = "/productos.html"
  status = 200

[[redirects]]
  from = "/editar"
  to = "/editar.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "DENY"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Content-Security-Policy = "default-src 'self'; img-src 'self' data: blob: https://i.ytimg.com; style-src 'self' 'unsafe-inline'; font-src 'self'; script-src 'self'; connect-src 'self'; media-src 'self' blob:; frame-src https://www.youtube-nocookie.com https://www.youtube.com https://www.facebook.com https://www.instagram.com https://www.tiktok.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self'"

[[headers]]
  for = "/editar*"
  [headers.values]
    X-Robots-Tag = "noindex"
    Cache-Control = "no-cache"

[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
